{% extends "base.html" %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card card-soft">
        <div class="card-body p-4">
          <h1 class="mb-2">Смена пароля</h1>
          <p class="text-muted">Пароль хранится только в виде Django hash и не отображается обратно.</p>

          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Изменить пароль</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
