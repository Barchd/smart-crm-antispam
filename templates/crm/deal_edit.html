{% extends "base.html" %}
{% block title %}Редактирование сделки{% endblock %}
{% block content %}
  <div class="card card-soft mx-auto" style="max-width: 820px;">
    <div class="card-header bg-white">
      <h1 class="h4 mb-0">{{ deal.title }}</h1>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Сохранить</button>
          <a class="btn btn-outline-secondary" href="{% url 'deal_detail' deal.pk %}">Назад</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
