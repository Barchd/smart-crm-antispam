{% extends "base.html" %}
{% block title %}Заявка{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card card-soft">
        <div class="card-body p-4">
          <h1 class="mb-2">Заявка</h1>
          <p class="text-muted">Демо-форма имитирует внешний источник, но проходит через обычный Django-view с CSRF.</p>
          {% if accepted %}
            <div class="alert alert-success" role="alert">Заявка принята.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Отправить</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
